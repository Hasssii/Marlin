name: Build Firmware

on:
  push:
    branches: [ bugfix-2.1.x ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio
          pio upgrade --dev

      - name: Build firmware
        run: |
          pio run -e mks_monster8

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-mks-monster8
          path: .pio/build/mks_monster8/firmware.bin
          if-no-files-found: error
